# Front for the bridge on the same machine, in the default no-overlay stack. Replace example.com with your RT_DOMAIN
# and RT_CONTROL_HOST, the ports with RT_VHOST_PORT and RT_CONTROL_PORT, and the certificate paths with your own.

# Tunnels: <label>.tunnel.example.com -> the vhost port.
server {
	listen 443 ssl;
	server_name *.tunnel.example.com;

	ssl_certificate /etc/ssl/rt/tunnel.example.com.pem;
	ssl_certificate_key /etc/ssl/rt/tunnel.example.com.key;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		# frps routes on the Host header, so nginx must not rewrite it.
		proxy_set_header Host $host;
		# `ctl doctor` recognises a working tunnel by `Server: websocat`, which nginx drops from proxied responses unless
		# told to pass it.
		proxy_pass_header Server;
		# An idle SSH session sends nothing for long stretches.
		proxy_read_timeout 1d;
		proxy_send_timeout 1d;
	}
}

# Control connection of RT_PROTOCOL=wss -> the control port. Not needed for quic or tcp.
server {
	listen 443 ssl;
	server_name bridge.example.com;

	ssl_certificate /etc/ssl/rt/bridge.example.com.pem;
	ssl_certificate_key /etc/ssl/rt/bridge.example.com.key;

	location / {
		proxy_pass http://127.0.0.1:7000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_read_timeout 1d;
		proxy_send_timeout 1d;
	}
}
