[project]
name = "reverse-tunnel-bridge"
version = "0.1.0"
description = "Bridge-side tooling for reverse-tunnel: registries, join code, compose generation"
requires-python = ">=3.13"
dependencies = ["cryptography>=43", "python-dotenv>=1", "pyyaml>=6", "ruamel.yaml>=0.19"]

[project.scripts]
ctl = "ctl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
