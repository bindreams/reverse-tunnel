[package]
name = "reverse-tunnel"
version = "0.1.0"
edition = "2024"
description = "Host tool for reverse-tunnel: supervises frpc to publish this machine's services through the bridge"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3.27.0"
