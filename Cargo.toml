[package]
name = "reverse-tunnel"
version = "0.1.0"
edition = "2024"
description = "Host tool for reverse-tunnel: supervises frpc to publish this machine's services through the bridge"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
cosca = { version = "0.6.0", features = ["tokio"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
gethostname = "1.1.0"
getrandom = "0.4.3"
goetia = { version = "0.3.0", default-features = false }
hex = "0.4.3"
# tz-system: the system zone (/etc/localtime on Unix, the Win32 API on Windows).
# tzdb-bundle-platform: Windows has no zoneinfo to resolve the zone's name against; a no-op elsewhere.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
yaml_serde = "0.10.7"
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
libsearch-guard = "0.1.1"

[dev-dependencies]
libsearch-guard = "0.1.1"

[target."cfg(unix)".dependencies]
libc = "0.2"
named-lock = "0.4.1"
uzers = "0.12.2"
# Resolves a TZ=Region/City variable from /usr/share/zoneinfo.
jiff = { version = "0.2.38", default-features = false, features = ["tzdb-zoneinfo"] }

[target."cfg(unix)".dev-dependencies]
rustix = { version = "1", default-features = false, features = ["process"] }

[target."cfg(windows)".dependencies]
known-folders = "1.4.2"

# Stands in for frpc in tests/, and for a binary's `run --check` in src/ops_tests.rs and src/install_tests.rs.
[[bin]]
name = "stub-frpc"
path = "testbin/stub_frpc.rs"
test = false
doc = false
