[package]
name = "reverse-tunnel"
version = "0.1.0"
edition = "2024"
description = "Host tool for reverse-tunnel: supervises frpc to publish this machine's services through the bridge"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
goetia = { version = "0.2.0", default-features = false }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
yaml_serde = "0.10.7"
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
known-folders = "1.4.2"
