[package]
name = "reverse-tunnel"
version = "0.1.0"
edition = "2024"
description = "Host tool for reverse-tunnel: supervises frpc to publish this machine's services through the bridge"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
cosca = { version = "0.6.0", features = ["tokio"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
gethostname = "1.1.0"
getrandom = "0.4.3"
goetia = { version = "0.3.0", default-features = false }
hex = "0.4.3"
# tz-system: the system zone (/etc/localtime on Unix, the Win32 API on Windows).
# tzdb-bundle-platform: Windows has no zoneinfo to resolve the zone's name against; a no-op elsewhere.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform"] }
named-lock = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
yaml_serde = "0.10.7"
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
libsearch-guard = "0.1.1"

[dev-dependencies]
libsearch-guard = "0.1.1"

[target."cfg(unix)".dependencies]
libc = "0.2"
uzers = "0.12.2"
# Resolves a TZ=Region/City variable from /usr/share/zoneinfo.
jiff = { version = "0.2.38", default-features = false, features = ["tzdb-zoneinfo"] }

[target."cfg(unix)".dev-dependencies]
rustix = { version = "1", default-features = false, features = ["process"] }

[target."cfg(windows)".dependencies]
known-folders = "1.4.2"
# The machine's `Path` (src/system_path.rs).
winreg = "0.56.0"
# The virtual account's SID is the SHA-1 of its name.
sha1 = "0.11.0"
# Security descriptors from SDDL strings (src/security.rs), the expansion of `Path` entries, and the broadcast that it changed.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_UI_WindowsAndMessaging"] }
# Task Scheduler's COM API, for the removal's task (src/schtasks.rs): the modules it imports. `RegisterTask` takes VARIANTs,
# and is gated on Ole and Variant.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_TaskScheduler", "Win32_System_Variant"] }

[target."cfg(windows)".dev-dependencies]
# tests/platform.rs: a job object that ends a session, and a DACL's effective rights.
windows-sys = { version = "0.61.2", features = ["Win32_System_JobObjects", "Win32_System_Threading"] }

# Stands in for frpc in tests/, and for a binary's `run --check` in src/ops_tests.rs and src/install_tests.rs.
[[bin]]
name = "stub-frpc"
path = "testbin/stub_frpc.rs"
test = false
doc = false
