# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]

# Local hooks ==========================================================================================================
[[repos]]
repo = "local"

[[repos.hooks]]
id = "format-section-comments"
name = "format section comments"
entry = "python scripts/format-section-comments.py"
language = "python"
types_or = ["rust", "python", "toml", "javascript", "ts", "jsx", "tsx", "dockerfile"]

[[repos.hooks]]
id = "ty"
name = "ty check"
entry = "uv run ty check"
language = "system"
types = ["python"]
pass_filenames = false

# Real names are matched by digest (scripts/personal-artifact-hashes.txt), so nothing here spells them.
[[repos.hooks]]
id = "no-personal-artifacts"
name = "no personal artifacts"
# Scans the index itself rather than the file names prek passes: that covers symlink targets and type changes.
entry = "python scripts/no-personal-artifacts.py --staged"
language = "python"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "no-personal-artifacts-message"
name = "no personal artifacts (commit message)"
entry = "python scripts/no-personal-artifacts.py --message"
language = "python"
stages = ["commit-msg"]
always_run = true

# External hooks =======================================================================================================
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.10.0.1"
# SC2310/SC2311: `set -e` does not apply inside a function called in a condition or a command substitution.
hooks = [{ id = "shellcheck", args = ["--enable=check-set-e-suppressed"] }]

[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker.python"
rev = "3.2.1"
hooks = [
  { id = "editorconfig-checker", exclude_types = ["rust", "markdown", "python"] },
]

[[repos]]
repo = "https://github.com/google/yapf"
rev = "v0.43.0"
hooks = [{ id = "yapf" }]

[[repos]]
repo = "https://github.com/hukkin/mdformat"
rev = "1.0.0"
hooks = [{ id = "mdformat", additional_dependencies = ["mdformat-gfm==1.0.0"] }]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [{ id = "conventional-pre-commit" }]
