# Test-only fronts for the bridge stack, added with `-f` and chosen with `--profile`:
#   nginx    examples/nginx.conf (rendered by the test) in front of compose.yaml's frps
#   caddy    examples/Caddyfile (rendered by the test) in front of compose.yaml's frps
#   traefik  a Traefik v3 on the external network that compose.traefik.yaml attaches frps to
# None of them has a healthcheck: the tests wait on each service's own log line (see front_support.READY), not on a
# health state Docker polls on a schedule.
# All serve TLS from the test's own CA and publish 443 on a port Docker picks; the test reads it with `compose port`.
services:
  nginx:
    profiles: [nginx]
    container_name: nginx
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    depends_on:
      frps:
        condition: service_started
    ports:
      - "127.0.0.1::443"
    volumes:
      - type: bind
        source: ./e2e/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./e2e/tls
        target: /etc/ssl/rt
        read_only: true

  caddy:
    profiles: [caddy]
    container_name: caddy
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    depends_on:
      frps:
        condition: service_started
    ports:
      - "127.0.0.1::443"
    volumes:
      - type: bind
        source: ./e2e/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ./e2e/tls
        target: /etc/ssl/rt
        read_only: true

  traefik:
    profiles: [traefik]
    container_name: traefik
    image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
    depends_on:
      frps:
        condition: service_started
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --log.level=DEBUG
      - --log.noColor=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
    ports:
      - "127.0.0.1::443"
    networks:
      - proxy
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: ./e2e/traefik-dynamic.yaml
        target: /etc/traefik/dynamic.yaml
        read_only: true
      - type: bind
        source: ./e2e/tls
        target: /etc/ssl/rt
        read_only: true
