# The certificates the e2e Traefik offers, chosen by the name in the client's SNI. `staging.localhost` is served by an
# issuer whose name contains STAGING; the others by the test CA's root.
tls:
  certificates:
    - certFile: /etc/ssl/rt/tunnel.example.com.pem
      keyFile: /etc/ssl/rt/tunnel.example.com.key
    - certFile: /etc/ssl/rt/localhost.pem
      keyFile: /etc/ssl/rt/localhost.key
    - certFile: /etc/ssl/rt/staging.localhost.pem
      keyFile: /etc/ssl/rt/staging.localhost.key
