[project]
name = "reverse-tunnel"
version = "0.1.0"
description = "Reverse SSH tunnels over frp and websocat: a bridge, hosts, and clients."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.md"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pywin32>=312 ; sys_platform == 'win32'",
    "sigstore>=4.5.0",
    "tomlkit>=0.15.1",
]

[tool.uv]
# `ctl` is run in place (`uv run -m ctl`), never installed.
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/platform"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "root: needs uid 0 and fails, never skips, without it; opt out explicitly with -m 'not root'",
  "mount: mounts filesystems; needs root and a private mount namespace, and fails, never skips, without them; opt out explicitly with -m 'not mount'",
]

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "ty>=0.0.85",
    "types-pywin32>=312.0.0.20261006",
    "yapf>=0.43.0",
]

[tool.ty.environment]
# `ctl` has Windows-only code paths (`ctl/env.py`); check them on every platform.
python-platform = "all"
