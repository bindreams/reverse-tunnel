name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # prek's `ty` hook shells out to `uv run`.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('prek.toml', 'uv.lock') }}
      - run: uv run prek run --all-files
      # The prek hook only sees staged changes; these cover the whole tree and every ref.
      - run: python3 scripts/no-personal-artifacts.py --tree
      # checkout fetches heads and tags only; notes and custom namespaces are public too. refs/pull/* is excluded: the
      # owner cannot delete a contributor's PR ref, so one bad PR would fail every later run. The PR under test is
      # still scanned, because on pull_request the checked-out HEAD is its merge commit.
      - run: git fetch --no-tags origin '+refs/*:refs/fetched/*' '^refs/pull/*'
      - run: python3 scripts/no-personal-artifacts.py --history

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unit

  bridge:
    name: Bridge end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # The runner is disposable, which is what RT_E2E_SANDBOX asserts: the tests publish ports and create containers.
      - run: uv run pytest tests/e2e/bridge
        env:
          RT_E2E_SANDBOX: "1"

  # Each platform job runs its directory by path: an empty collection is exit code 5, never a quiet pass.
  platform-posix:
    name: Platform tests (POSIX, as root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # Unelevated, so the environment is owned by the runner user rather than root.
      - run: uv sync --locked
      # The tests that need no privilege, as the unprivileged runner user.
      - run: uv run pytest -p no:cacheprovider -m "not root" tests/unit tests/platform/posix
      # The ownership tests chown to this account and fail without it.
      - run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin rt-test-svc
      - run: sudo -E env "PATH=$PATH" .venv/bin/python -m pytest -p no:cacheprovider -m "not mount" tests/platform/posix
      # The mount tests change the mount table, so they run only in a private mount namespace that dies with them.
      - run: sudo unshare --mount --propagation private env RT_PRIVATE_MOUNT_NS=1 "PATH=$PATH" .venv/bin/python -m pytest -p no:cacheprovider -m mount tests/platform/posix

  platform-macos:
    name: Platform tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # The tests that need no privilege, as the unprivileged runner user.
      - run: uv run pytest -p no:cacheprovider -m "not root" tests/unit tests/platform/posix
      # The ownership tests chown to this account and fail without it. The uid avoids the one the tests leave unnamed.
      # Like `useradd` on Linux, give it a primary group of its own with the same name.
      - name: Create the second account
        run: |
          account=rt-test-svc
          sudo dscl . -create "/Groups/$account"
          sudo dscl . -create "/Groups/$account" PrimaryGroupID 4300
          sudo dscl . -create "/Users/$account"
          sudo dscl . -create "/Users/$account" UserShell /usr/bin/false
          sudo dscl . -create "/Users/$account" UniqueID 4300
          sudo dscl . -create "/Users/$account" PrimaryGroupID 4300
          sudo dscl . -create "/Users/$account" NFSHomeDirectory /var/empty
      - run: sudo -E env "PATH=$PATH" .venv/bin/python -m pytest -p no:cacheprovider -m "not mount" tests/platform/posix

  platform-windows:
    name: Platform tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unit tests/platform/windows
