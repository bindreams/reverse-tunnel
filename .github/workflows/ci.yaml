name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The draft release runs all of CI against the release commit.
  workflow_call:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked ctl --help
      - run: uv run --locked pytest

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # The network tests are unit tests of the library. The platform tests are ignored too, and run in their own job.
      - name: Fetch every pinned frpc
        run: cargo test --locked --lib -- --ignored

  # Installs the real service on the runner, as root.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the platform tests
        run: |
          set -euo pipefail
          cargo test --locked --test platform --no-run --message-format=json \
              | jq -r 'select(.target.name == "platform" and .executable != null) | .executable' \
              > "$RUNNER_TEMP/platform-tests"
      # A hung wait ends the step, rather than the job, so that its log is kept.
      - name: Run the platform tests as root
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          sudo env RT_PLATFORM_TESTS=1 "$(cat "$RUNNER_TEMP/platform-tests")" --ignored --test-threads=1 --nocapture

  # Defender flags the frp Windows zip but not frpc.exe; fetch writes only frpc.exe. Fails if Defender, live and with
  # no exclusions, blocks it.
  defender:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the tests
        shell: bash
        run: cargo test --locked --no-run
      - name: Turn real-time protection on
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $false
          while (-not (Get-MpComputerStatus).RealTimeProtectionEnabled) { }
          if (-not (Get-MpComputerStatus).RealTimeProtectionEnabled) { throw 'real-time protection is off' }
          Get-MpComputerStatus | Format-List AntivirusEnabled, RealTimeProtectionEnabled, IoavProtectionEnabled
      - name: Remove every Defender exclusion
        shell: pwsh
        run: |
          $pref = Get-MpPreference
          if ($pref.ExclusionPath) { Remove-MpPreference -ExclusionPath $pref.ExclusionPath }
          if ($pref.ExclusionExtension) { Remove-MpPreference -ExclusionExtension $pref.ExclusionExtension }
          if ($pref.ExclusionProcess) { Remove-MpPreference -ExclusionProcess $pref.ExclusionProcess }
          $pref = Get-MpPreference
          $pref | Format-List ExclusionPath, ExclusionExtension, ExclusionProcess
          if ($pref.ExclusionPath -or $pref.ExclusionExtension -or $pref.ExclusionProcess) { throw 'exclusions remain' }
      - name: Defender blocks the EICAR test file in the workspace
        shell: pwsh
        run: |
          # Split so that this file does not trip Defender.
          $eicar = Join-Path $env:GITHUB_WORKSPACE 'eicar.com'
          try {
            Set-Content -Path $eicar -NoNewline -Value ('X5O!P%@AP[4\PZX54(P^)7CC)7}' + '$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*')
          } catch {
            Write-Output "write refused: $($_.Exception.Message)"
          }
          Get-MpComputerStatus | Format-List AMServiceEnabled, AMRunningMode, OnAccessProtectionEnabled, RealTimeProtectionEnabled, BehaviorMonitorEnabled, IsTamperProtected, AntivirusSignatureVersion
          Get-Service WinDefend | Format-List Name, Status
          if (-not (Test-Path $eicar)) { throw 'the EICAR file was removed on write, before the read' }
          Get-Content -Path $eicar -ErrorAction Continue
          while ((Test-Path $eicar) -and -not (Get-MpThreatDetection | Where-Object { $_.Resources -like '*eicar.com*' })) { }
          Get-MpThreatDetection | Format-List ThreatID, Resources, ActionSuccess
          if (-not (Get-MpThreatDetection | Where-Object { $_.Resources -like '*eicar.com*' })) { throw 'no EICAR detection' }
      - name: Fetch frpc.exe and run it
        shell: bash
        run: cargo test --locked frpc_verify_accepts_render -- --ignored

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Write a test deployment
        run: |
          printf 'TUNNEL_DOMAIN=tunnel.binarydreams.me\nFRPS_TOKEN=test-token\nCOMPOSE_FILE=compose.yaml:compose.generated.yaml\n' > .env
          printf 'services: {}\n' > compose.generated.yaml
          mkdir tls state
          touch state/hosts.yaml state/aliases.yaml
          (umask 077; . ./.env; uv run --locked python -c 'import sys; from ctl.certs import make_cert; c, k = make_cert(sys.argv[1]); open("tls/frps.crt", "w").write(c); open("tls/frps.key", "w").write(k)' "$TUNNEL_DOMAIN")
          docker network create gateway
      - name: frps router rule ends in the domain and an escaped $$
        run: |
          docker compose config | grep -E 'reverse-tunnel-frps\.rule: .*tunnel\.binarydreams\.me\\E\$\$`\)$'
      - run: docker compose build
      - run: docker compose up -d
      - name: frps loads its certificate and starts
        run: |
          until grep -q 'frps started successfully' <<< "$(docker compose logs reverse-tunnel-frps)"; do
            if [ "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' reverse-tunnel-frps)" != "true 0" ]; then
              docker compose logs
              exit 1
            fi
          done
      - name: Container label has a single $
        run: docker inspect -f '{{index .Config.Labels "traefik.http.routers.reverse-tunnel-frps.rule"}}' reverse-tunnel-frps | grep -E 'tunnel\.binarydreams\.me\\E\$`\)$'
      - name: plugin runs as non-root and reads state/
        run: docker compose run --rm --no-deps reverse-tunnel-plugin python -c "import ctl.plugin as p, pathlib; p.read_hosts(pathlib.Path('/state/hosts.yaml'))"

  # The bridge behind Traefik and Pebble in Docker, and a real host installed as a service on the runner.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cargo build --locked --release --bin reverse-tunnel
      - name: Install sshd and websocat
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo systemctl enable --now ssh
          curl -fsSL -X GET -o websocat https://github.com/vi/websocat/releases/download/v1.14.1/websocat.x86_64-unknown-linux-musl
          echo '66f8dd3a0394761556339117f8bb5123bddefd44e087af2a72ec22b0bd08d514  websocat' | sha256sum -c -
          sudo install -m 755 websocat /usr/local/bin/websocat
      - run: docker network create gateway
      # The step timeout, not the job's, so the logs step still runs.
      - name: Run the end-to-end tests
        timeout-minutes: 20
        run: RT_E2E=1 uv run --project server --locked pytest e2e/test_e2e.py -v -s --durations=0 --tb=short
      - name: Logs
        if: failure()
        run: |
          docker ps -a
          for c in pebble traefik reverse-tunnel-frps reverse-tunnel-plugin; do echo "=== $c"; docker logs "$c" 2>&1 | tail -n 100; done
          sudo tail -n 100 /var/log/reverse-tunnel/frpc.log /var/log/reverse-tunnel/supervisor.log
