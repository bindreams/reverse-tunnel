name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string

# Every publish takes its turn, whatever the version: each reads the published releases and then sets `--latest`, so two
# at once could leave a lower version marked latest. A second dispatch waits, then finds its release published. GitHub
# keeps one pending run per group, so a newer dispatch cancels a pending one: re-dispatch the version that was cancelled.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Version, CI and builds were checked in draft-release.yaml before the draft existed; the environment's required
    # reviewer approves this release.
    environment: Deploy
    permissions:
      # `write`, not `read`: the List releases API only returns drafts to a caller with push access.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # The dispatch ref's checkout, for the scripts that name the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalize and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: bash .github/scripts/emit-version.sh "$INPUT_VERSION"

      - name: Verify draft release exists and resolve commit SHA
        id: release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! RELEASE_JSON="$(gh release view "$TAG" --json isDraft,isPrerelease,targetCommitish)"; then
            echo "::error::gh release view failed for $TAG. Does the draft release exist?"
            exit 1
          fi

          IS_DRAFT="$(jq -r '.isDraft' <<<"$RELEASE_JSON")"
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release $TAG is already published"
            exit 1
          fi

          TARGET="$(jq -r '.targetCommitish' <<<"$RELEASE_JSON")"
          if ! [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Draft release target '$TARGET' is not a 40-char commit SHA. Delete the draft, then re-run the Draft Release workflow."
            exit 1
          fi
          echo "commit_sha=$TARGET" >> "$GITHUB_OUTPUT"
          PRERELEASE="$(jq -r '.isPrerelease | if type == "boolean" then . else error("isPrerelease is \(.)") end' <<<"$RELEASE_JSON")"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.commit_sha }}

      - name: Re-verify the manifest version matches the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: bash .github/scripts/assert-manifest-version.sh "$VERSION"

      - name: Publish GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.release.outputs.commit_sha }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          # Publishing marks the release "latest" unless told otherwise, and `upgrade` follows `releases/latest`, which
          # skips drafts and prereleases, as the list below does. An older version published late must not take the mark
          # from a newer one.
          PUBLISHED_TAGS="$(gh api -X GET --paginate "repos/${GH_REPO}/releases" --jq '.[] | select((.draft or .prerelease) | not) | .tag_name')"
          NEWEST="$({ grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' <<<"$PUBLISHED_TAGS" || true; echo "$TAG"; } | sort -V | tail -n 1)"
          LATEST=false
          if [ "$NEWEST" = "$TAG" ] && [ "$PRERELEASE" = false ]; then
            LATEST=true
          fi
          echo "newest of the published releases and $TAG: $NEWEST; marking $TAG latest=$LATEST"

          # What the tag names, read as a tag: `commits/<name>` would also accept a branch of that name. An annotated
          # tag gives its tag object, which never equals $SHA, so it is refused.
          tag_object() { gh api -X GET "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha'; }

          # The tag is created here, on $SHA, so the release never binds to a tag that appeared since the draft. If the
          # tag exists, it must already be on $SHA: then it is this release's own, from a publish that failed after
          # creating it, and re-running the publish finishes it (until the release is public).
          if ! gh api -X POST "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${SHA}" >/dev/null; then
            if ! EXISTING="$(tag_object)"; then
              echo "::error::Could not create tag $TAG, and it does not exist: see the errors above."
              exit 1
            fi
            if [ "$EXISTING" != "$SHA" ]; then
              echo "::error::Tag $TAG exists on $EXISTING, not on the draft's $SHA. Delete the tag if GitHub allows it; a tag an immutable release has used cannot be, so then bump the version in Cargo.toml on main and draft that version."
              exit 1
            fi
          fi

          gh release edit "$TAG" --draft=false --latest="$LATEST"

          # Read the tag back: `targetCommitish` is only the stored input from release creation and would echo $SHA.
          if ! PUBLISHED="$(tag_object)"; then
            echo "::error::Could not resolve tag $TAG after publishing. The release is public; verify by hand that $TAG points at $SHA, then dispatch the Mirror workflow with $TAG."
            exit 1
          fi

          if [ "$PUBLISHED" != "$SHA" ]; then
            echo "::error::Release $TAG points at $PUBLISHED, not at $SHA. The release is public and, with immutable releases, cannot be changed: mark the previous release latest, then bump the version in Cargo.toml on main and draft that version."
            exit 1
          fi

          printf 'Release published: https://github.com/%s/releases/tag/%s\n' "$GH_REPO" "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

  # A tag made with GITHUB_TOKEN triggers no workflow, so this job pushes the mirror's tag itself. If it fails, the
  # release stays published: dispatch the Mirror workflow with the tag.
  mirror:
    name: Mirror the tag
    needs: publish
    uses: ./.github/workflows/mirror.yaml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets:
      MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
    permissions:
      contents: read
