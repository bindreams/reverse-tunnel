name: Measure logind

# Temporary: measures what systemd-run --wait reports. Deleted before the PR is ready.
on:
  push:
    paths: [".github/workflows/measure-logind.yaml"]
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: A systemd-run --wait client reports the command's exit status
        run: |
          set +e
          systemd-run --version | head -1
          sudo systemd-run --wait --collect --unit=measure-exit -- sh -c 'exit 3'
          echo "RESULT systemd-run --wait exit status for exit 3: $?"
          sudo systemd-run --wait --collect --unit=measure-ok -- sh -c 'exit 0'
          echo "RESULT systemd-run --wait exit status for exit 0: $?"
