name: probe

on:
  pull_request:

jobs:
  ident:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Who is provjobd
        shell: pwsh
        run: |
          Get-Process -Name 'provjobd*' | Format-List Id, Name, Path, Company, Description, ProductVersion, FileVersion, StartTime
          Get-CimInstance Win32_Process -Filter "Name like 'provjobd%'" | Format-List ProcessId, ParentProcessId, ExecutablePath, CommandLine, CreationDate
          $ppid = (Get-CimInstance Win32_Process -Filter "Name like 'provjobd%'" | Select-Object -First 1).ParentProcessId
          Get-CimInstance Win32_Process -Filter "ProcessId = $ppid" | Format-List ProcessId, Name, ExecutablePath, CommandLine
          Get-Item (Get-Process -Name 'provjobd*' | Select-Object -First 1).Path | Format-List FullName, Length, CreationTime
          (Get-Item (Get-Process -Name 'provjobd*' | Select-Object -First 1).Path).VersionInfo | Format-List *
          Get-AuthenticodeSignature (Get-Process -Name 'provjobd*' | Select-Object -First 1).Path | Format-List Status, SignerCertificate
          Get-CimInstance Win32_Service | Where-Object { $_.ProcessId -eq (Get-Process -Name 'provjobd*' | Select-Object -First 1).Id } | Format-List Name, DisplayName, PathName
