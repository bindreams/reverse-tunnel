# Overlay for a Traefik v3 that shares a Docker network with this stack (the rules use v3's `HostRegexp` syntax):
#   COMPOSE_FILE=compose.yaml:compose.traefik.yaml   (in .env; then run bare `docker compose up --wait`, not `-f`)
# Set the entrypoints and TLS of the two routers on Traefik's side (for example `entryPoints.<name>.http.tls`), or per
# router in your own `compose.override.yaml`; `examples/compose.override.yaml` is a starting point.
services:
  frps:
    # `!override` replaces the whole list, so the control and admin publishes are declared again; only the vhost
    # publish is dropped, because Traefik reaches it over the shared network.
    ports: !override
      - "${RT_CONTROL_PORT:?set RT_CONTROL_PORT in .env}:8001/tcp"
      - "${RT_CONTROL_PORT:?set RT_CONTROL_PORT in .env}:8001/udp"
      - "127.0.0.1:${RT_ADMIN_PORT:?set RT_ADMIN_PORT in .env}:7500/tcp"
    # Attached to two networks, so Traefik needs `traefik.docker.network` to pick the shared one.
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${RT_PROXY_NETWORK:?set RT_PROXY_NETWORK in .env}
      # Tunnels: <label>.RT_DOMAIN. Host names are case-insensitive, hence `(?i)`; `\Q..\E` takes the domain's dots
      # literally. frps routes on Host, so Traefik passes it on unchanged.
      traefik.http.routers.rt-vhost.rule: 'HostRegexp(`(?i)^[a-z0-9-]+\.\Q${RT_DOMAIN:?set RT_DOMAIN in .env}\E$$`)'
      traefik.http.routers.rt-vhost.service: rt-vhost
      traefik.http.services.rt-vhost.loadbalancer.server.port: "8080"
      traefik.http.services.rt-vhost.loadbalancer.passhostheader: "true"
      # The control connection of RT_PROTOCOL=wss: `GET /~!frp` with `Upgrade: websocket` on bindPort.
      traefik.http.routers.rt-control.rule: 'Host(`${RT_CONTROL_HOST:?set RT_CONTROL_HOST in .env}`)'
      traefik.http.routers.rt-control.service: rt-control
      traefik.http.services.rt-control.loadbalancer.server.port: "8001"

networks:
  proxy:
    name: ${RT_PROXY_NETWORK:?set RT_PROXY_NETWORK in .env}
    external: true
